<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">天气、气候、大气科学和应用气象学的关系示意图</title>
  <desc id="desc">天气描述某时某地的大气状态，许多天气记录积累后形成气候的长期统计背景。大气科学研究这些状态和过程，应用气象学把相关知识用于实际决策。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#355c7d"/>
    </marker>
    <style>
      .box { stroke: #24445b; stroke-width: 3; rx: 18; }
      .title { font: 700 30px sans-serif; fill: #17324d; }
      .label { font: 700 25px sans-serif; fill: #17324d; }
      .body { font: 22px sans-serif; fill: #243746; }
      .note { font: 20px sans-serif; fill: #355c7d; }
      .arrow { stroke: #355c7d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1100" height="560" fill="#f7fbfd"/>
  <text x="550" y="55" text-anchor="middle" class="title">先问：我们在描述哪一种“大气状态”？</text>

  <rect x="70" y="110" width="280" height="170" fill="#dceef7" class="box"/>
  <text x="210" y="155" text-anchor="middle" class="label">天气</text>
  <text x="210" y="198" text-anchor="middle" class="body">某时、某地</text>
  <text x="210" y="232" text-anchor="middle" class="body">正在发生的状态</text>
  <text x="210" y="265" text-anchor="middle" class="note">例：今天南京有雷阵雨</text>

  <rect x="750" y="110" width="280" height="170" fill="#e8e8f7" class="box"/>
  <text x="890" y="155" text-anchor="middle" class="label">气候</text>
  <text x="890" y="198" text-anchor="middle" class="body">多年、某地区</text>
  <text x="890" y="232" text-anchor="middle" class="body">统计出的背景</text>
  <text x="890" y="265" text-anchor="middle" class="note">例：南京夏季的长期规律</text>

  <path d="M 350 195 C 470 145, 630 145, 750 195" class="arrow"/>
  <text x="550" y="140" text-anchor="middle" class="note">记录不断积累</text>

  <rect x="360" y="330" width="380" height="125" fill="#fff0d8" class="box"/>
  <text x="550" y="372" text-anchor="middle" class="label">大气科学</text>
  <text x="550" y="408" text-anchor="middle" class="body">研究大气状态、过程与相互作用</text>
  <path d="M 210 280 L 420 350" class="arrow"/>
  <path d="M 890 280 L 680 350" class="arrow"/>

  <rect x="120" y="465" width="860" height="60" fill="#dff2e5" class="box"/>
  <text x="550" y="503" text-anchor="middle" class="body">应用气象学：把气象信息连接到农业、城市、健康、交通和能源决策</text>
  <path d="M 550 455 L 550 465" class="arrow"/>
</svg>
